name: torah_library
description: הספרייה התורנית — Digital Torah Library (Flutter desktop)
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  system_fonts: ^1.0.0
  flutter_launcher_icons: ^0.13.1 
  
  # ── WebView & Local Server (ONLYOFFICE) ────────────────────────────────────
  webview_windows: ^0.3.0
  shelf: ^1.4.0
  shelf_static: ^1.1.0

  # ── State management ───────────────────────────────────────────────────────
  provider:           ^6.1.2
  flutter_riverpod:   ^2.4.0

  # ── Settings persistence ───────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── Frameless window (desktop) ─────────────────────────────────────────────
  window_manager:     ^0.3.9

  # ── PDF rendering ──────────────────────────────────────────────────────────
  pdfrx:              ^1.0.77

  # ── Audio & Utils ──────────────────────────────────────────────────────────
  file_picker:        ^8.1.2
  win32: ^5.5.0
  ffi: ^2.1.0
  path:               ^1.9.0
  path_provider:      ^2.1.4

  # ── TagPlus (document editor) ──────────────────────────────────────────────
  pdf:                ^3.10.7
  printing:           ^5.12.0
  sqlite3: ^3.3.2
  sqlite3_flutter_libs: ^0.6.0+eol

  # ── Otzaria Viewer Dependencies ────────────────────────────────────────────
  flutter_bloc: ^8.1.5
  flutter_html: ^3.0.0-beta.2
  scrollable_positioned_list: ^0.3.8
  flutter_settings_screens: ^0.3.3
  flutter_context_menu: ^0.2.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/themes.json
    - assets/data/categories.json
    - assets/instructions.pdf
    - assets/icon/
    - transcription_worker.py